# Kubernetes probe wiring for teable-backend.
#
# Drop-in for an existing Deployment. Adjust the container name (`teable`)
# and port (`3000`) to match the local manifest. Both probes point at the
# NestJS routes introduced in Wave 12 (T-12-07):
#   - /healthz  → liveness  (only fails when the process is wedged)
#   - /readyz   → readiness (fails when any dep is unreachable)
#
# The probe timings are tuned for an SRE-grade posture:
#   - liveness initial-delay=20s gives the DB pool / migrations time to warm;
#     failureThreshold=3 means the container restarts after ~30s of unhealth.
#   - readiness failureThreshold=2 with a 5s interval means a single slow
#     dependency check (~1.5s budget each, 3 in parallel) takes the pod out
#     of the Service rotation within ~10s of an outage starting.
#
# A `startupProbe` is also included so a slow first-boot (e.g. large seed
# import, JIT compile) does not trip the liveness probe and cause a
# crashloop before the app finishes warming up.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: teable-backend
  labels:
    app: teable-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: teable-backend
  template:
    metadata:
      labels:
        app: teable-backend
    spec:
      containers:
        - name: teable
          image: ghcr.io/teable/teable:latest
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: NODE_ENV
              value: production
          # Allow up to 90s for the first boot before the startup probe is
          # considered failed. This is independent of liveness/readiness,
          # so a slow first request does not crash the pod.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
            successThreshold: 1
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
            successThreshold: 1
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: teable-backend
  labels:
    app: teable-backend
spec:
  type: ClusterIP
  selector:
    app: teable-backend
  ports:
    - name: http
      port: 80
      targetPort: http