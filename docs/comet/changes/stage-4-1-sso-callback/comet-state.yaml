acceptance:
  - id: A1
    source: brief.md
    text: "**A1** SSO callback 完整会话链路: 1. `GET
      /api/auth/sso/login?emailHint=alice@acme.com`(已注册 SsoIdentityProvider,域匹配)
      → 302 到 IdP authorize。 2. 模拟 IdP 回调 `GET
      /api/auth/sso/callback?state=<opt-test-state>&code=<test-code>`。 3.
      callback 内:(a) 校验 state 未消费且未过期;(b) 用 code 换
      id_token/access_token(mock);(c) RS256 + iss/aud/exp 校验(mock JWKS);(d)
      `SsoAuthService.resolveLocalUser()` 返回 user;(e) 调
      `SessionService.createSession(userId, reqMeta)` 写本地 session cookie;(f) 标记
      `SsoLoginState.consumed=true`,302 到目标 redirect。 4. 后续 `GET
      /api/auth/profile` 用 callback 写入的 cookie → 返回 `{ id, name, email, isAdmin
      }` 与 callback 中 user 一致。"
    result: passed
    reason:
      text: Stage 4.1 A1 pass
      truncated: false
  - id: A2
    source: brief.md
    text: "**A8** License 激活联动:设 `TEABLE_LICENSE_KEY=plan:business`
      后,`/api/auth/sso/*` 不再被 `LicenseCapabilityGuard` 拒绝;若未设 license,`GET
      /api/auth/sso/login` 直接抛 `402 LICENSE_REQUIRED`。"
    result: passed
    reason:
      text: Stage 4.1 A2 pass
      truncated: false
