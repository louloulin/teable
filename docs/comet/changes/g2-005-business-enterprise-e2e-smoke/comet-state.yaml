  - id: A4
    source: brief.md
    text: "**A4** `LicenseCapabilityService.snapshot()` plan=free 时,仅
      ai_chat=true,其余付费 capability 全部 false。"
    result: pending
    reason: null
  - id: A5
    source: brief.md
    text: "**A5** `LicenseCapabilityGuard('sso').canActivate()` 在 plan=free /
      plan=pro 下抛 `HttpErrorCode.LICENSE_REQUIRED`(或对应 402 状态);plan=business /
      plan=enterprise / plan=self_hosted 下不抛、放行。"
    result: pending
    reason: null
  - id: A6
    source: brief.md
    text: "**A6** `LicenseCapabilityGuard('automation').canActivate()` 在
      plan=business 下放行,在 plan=pro 下抛 402。"
    result: pending
    reason: null
  - id: A7
    source: brief.md
    text: "**A7** `LicenseService.resolve({ token: 'plan:business' })` 返回 `{ source:
      'env', claims: { plan: 'business', expiresAt: 0 }, effectiveLimits:
      PLAN_LIMITS.business
      }`,effectiveLimits.rowLimit=1_000_000、attachmentByteLimit=100GB、automatio\
      nRunLimit=100_000、aiCreditLimit=2_000、apiRequestLimitPerSec=100(具体阈值以
      quota.constants.ts PLAN_LIMITS.business 为准)。"
    result: pending
    reason: null
  - id: A8
    source: brief.md
    text: "**A8** `LicenseService.resolve({ token: 'plan:enterprise' })` 返回
      effectiveLimits 全字段 null;`QuotaService.consume({ plan: 'enterprise', ...
      })` 命中 `isUnlimited()`,不抛 QuotaExceededException。"
    result: pending
    reason: null
  - id: A9
    source: brief.md
    text: "**A9** `LicenseService.resolve({ token: 'plan:self_hosted' })` 返回
      effectiveLimits 全字段 null,且 `isUnlimited()` 仍返回 true;CapabilityGuard
      全放行(OSS 守门不挡)。"
    result: pending
    reason: null
  - id: A10
    source: brief.md
    text: "**A10** 5-plan 全集 smoke 跑通:同一个 vitest 测试文件,5 个 describe block × 7 个 smoke
      检查 = 至少 35 个 `it()`,全部 passed。"
    result: pending
    reason: null
