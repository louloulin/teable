      text: global.module.ts providers list contains QuotaEnforcementInterceptor bound
        to APP_INTERCEPTOR via useClass (line 137-144), env-conditional.
      truncated: false
  - id: A2
    source: brief.md
    text: "**GA2 env 默认关闭**:`TEABLE_QUOTA_ENFORCEMENT_ENABLED` 不设或 `false`
