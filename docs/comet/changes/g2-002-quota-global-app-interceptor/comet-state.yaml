      text: "Env-conditional spread `...(process.env.TEABLE_QUOTA_ENFORCEMENT_ENABLED
        === 'true' ? [{...}] : [])` returns empty array when env !== 'true'; no
        APP_INTERCEPTOR provider instantiated."
      truncated: false
