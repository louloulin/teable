  - id: A7
    source: specs/g2-002-quota-global-app-interceptor/spec.md
    text: 将 `QuotaEnforcementInterceptor` 注册为 NestJS 全局 `APP_INTERCEPTOR`,由环境变量闸控
      (`TEABLE_QUOTA_ENFORCEMENT_ENABLED`,默认 `false`)。闸开启后,所有 controller handler
      在执行前会调用 `QuotaService.consume(...)`,按 space / plan 实时判断是否超阈值, 超阈值时抛出
      `QuotaExceededException`(HTTP 402,cause `'QUOTA_EXCEEDED'`)。 默认 OFF 保证 OSS
      自部署零影响。
    result: passed
    reason:
      text: "Implementation matches the spec's purpose statement verbatim: env-gated
        APP_INTERCEPTOR with TEABLE_QUOTA_ENFORCEMENT_ENABLED, default false,
        throws QuotaExceededException(HTTP 402, cause 'QUOTA_EXCEEDED')."
      truncated: false
