schema: comet.native.children.v2

# Acceptance index — keyed by brief-derived ID A1-A19;
# Runtime 从 brief.md 抽取这些 ID 到 state.acceptance,
# 这里 text 必须与 brief.md 中 Acceptance examples 段完全一致。
acceptance_index:
  A1:
    source: brief.md
    text: "**A1** SSO callback 完整会话链路:从 /api/auth/sso/login 走完到本地 session cookie 写入,后续 /api/auth/profile 返回正确 user。"
  A2:
    source: brief.md
    text: "**A2** 审计日志存在与可检索:任何 record create/update/delete 在 DB 留对应 audit_log 行,可在 /api/admin/audit-log 分页筛选。"
  A3:
    source: brief.md
    text: "**A3** 权限矩阵热路径生效:hidden 字段在 list 响应中为 null,PATCH 写 hidden 字段返回 403 RESTRICTED_RESOURCE,row filter 实际缩小查询结果。"
  A4:
    source: brief.md
    text: "**A4** AI 细分计费:free plan 调 ai_field 返回 402 LICENSE_REQUIRED;pro plan 调 cuppy_claw 返回 402;business plan 调 ai_app_builder 不返错。"
  A5:
    source: brief.md
    text: "**A5** 自定义应用域名端点:/api/admin/custom-domain/check?domain=foo.com 返回 cnameTarget。"
  A6:
    source: brief.md
    text: "**A6** 配额 retention 差异化:plan 切到 business 后,record history cleanup 保留期内记录保留,过期记录被删除。"
  A7:
    source: brief.md
    text: "**A7** API 速率限制按档位:business plan 下超过 10 req/s 返回 429;self_hosted plan 默认无限。"
  A8:
    source: brief.md
    text: "**A8** License 激活联动:设 TEABLE_LICENSE_KEY=plan:business,启动后所有 spaces 自动切到 business plan。"
  A9:
    source: brief.md
    text: "**A9** SsoLoginState BullMQ 清理:超过 5 分钟的 state 行被删除,DB 中无残留。"
  A10:
    source: brief.md
    text: "**A10** Prisma migration 全部成功:测试库顺序应用 0 失败,prisma generate 拿到全部枚举。"
  A11:
    source: brief.md
    text: "**A11** 单测全绿:pnpm test 在 apps/nestjs-backend 0 失败,新模块单元测试覆盖所有决策点。"
  # Round 28 G2 接线加固验收(用户授权 2026-08-26T01:06Z 全量实现)
  G2A1:
    source: brief.md
    text: "**G2A1** 全局权限矩阵 Guard/Interceptor 接线:任意 /api/space/* /api/base/* /api/table/* 写操作命中矩阵行/列/字段规则,hidden 字段在 PATCH 时返回 403 RESTRICTED_RESOURCE,row filter 真实缩小查询结果。"
  G2A2:
    source: brief.md
    text: "**G2A2** Quota 全局 Interceptor + Plan-aware 阈值:TEABLE_QUOTA_ENFORCEMENT_ENABLED=true 时,所有写请求按 plan 配额(行数/附件/API 调用)生效,超额返回 429 QUOTA_EXCEEDED。"
  G2A3:
    source: brief.md
    text: "**G2A3** Audit 全局 Interceptor:APP_INTERCEPTOR 自动审计所有 controller 调用,与 @Audit() 双轨并存,漏 service 补齐后端到端审计无残留。"
  G2A4:
    source: brief.md
    text: "**G2A4** HttpErrorCode 静态校验:build-time 检查所有 HttpErrorCode.* 引用命中现有枚举键,失配即 build fail;运行时不再抛 RangeError。"
  G2A5:
    source: brief.md
    text: "**G2A5** business/enterprise plan 端到端冒烟:TEABLE_LICENSE_KEY=plan:business 启动后,/api/admin/permission-matrix/* /api/admin/sso/providers /api/admin/audit-log 全套端点通过闸门后业务路径不崩。"
  G2A6:
    source: brief.md
    text: "**G2A6** Wave N1 模块接线:ip-allowlist / risk-control / turnstile / delete-user / retention / tracking / metrics / session 全部在 app.module.ts 激活,各 module controller 暴露端点 smoke 测试通过。"
  G2A7:
    source: brief.md
    text: "**G2A7** Wave N2 模块接线:github / google / social / chart / dashboard / database-view / graph / stack / view / model / computed / field-calculate / field-duplicate / record-modify / table-domain / record / table / folder / data-loader / query-builder / plugins / calculation / last-visit 共 20+ module 接线,各模块 controller 可达。"
  G2A8:
    source: brief.md
    text: "**G2A8** Webhook / BYOK / KMS / DR 复制(Wave H 漏接):webhook-bridge / webhook-delivery / byok-kms / byok-llm / kms-encrypt / dr-replication 等 module 接线,端到端 smoke 命中。"
  G2A9:
    source: brief.md
    text: "**G2A9** OpenAPI 文档站 + E2E 测试覆盖:Stage 103-106 输出文档站可访问,E2E 测试集覆盖 G2A1~G2A8 主要端点。"
  G2A10:
    source: brief.md
    text: "**G2A10** 全局回归 + 文档同步:pnpm test 全绿,G2A1~G2A9 全部独立验证,最终 Supervisor Verifier 在集成分支一次过 A1-A11 + G2A1-G2A10。"

