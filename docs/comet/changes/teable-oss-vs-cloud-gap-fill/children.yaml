schema: comet.native.children.v2

# Acceptance index — keyed by brief-derived ID A1-A19;
# Runtime 从 brief.md 抽取这些 ID 到 state.acceptance,
# 这里 text 必须与 brief.md 中 Acceptance examples 段完全一致。
acceptance_index:
  A1:
    source: brief.md
    text: "**A1** SSO callback 完整会话链路:从 /api/auth/sso/login 走完到本地 session cookie 写入,后续 /api/auth/profile 返回正确 user。"
  A2:
    source: brief.md
    text: "**A2** 审计日志存在与可检索:任何 record create/update/delete 在 DB 留对应 audit_log 行,可在 /api/admin/audit-log 分页筛选。"
  A3:
    source: brief.md
    text: "**A3** 权限矩阵热路径生效:hidden 字段在 list 响应中为 null,PATCH 写 hidden 字段返回 403 RESTRICTED_RESOURCE,row filter 实际缩小查询结果。"
  A4:
    source: brief.md
    text: "**A4** AI 细分计费:free plan 调 ai_field 返回 402 LICENSE_REQUIRED;pro plan 调 cuppy_claw 返回 402;business plan 调 ai_app_builder 不返错。"
  A5:
    source: brief.md
    text: "**A5** 自定义应用域名端点:/api/admin/custom-domain/check?domain=foo.com 返回 cnameTarget。"
  A6:
    source: brief.md
    text: "**A6** 配额 retention 差异化:plan 切到 business 后,record history cleanup 保留期内记录保留,过期记录被删除。"
  A7:
    source: brief.md
    text: "**A7** API 速率限制按档位:business plan 下超过 10 req/s 返回 429;self_hosted plan 默认无限。"
  A8:
    source: brief.md
    text: "**A8** License 激活联动:设 TEABLE_LICENSE_KEY=plan:business,启动后所有 spaces 自动切到 business plan。"
  A9:
    source: brief.md
    text: "**A9** SsoLoginState BullMQ 清理:超过 5 分钟的 state 行被删除,DB 中无残留。"
  A10:
    source: brief.md
    text: "**A10** Prisma migration 全部成功:测试库顺序应用 0 失败,prisma generate 拿到全部枚举。"
  A11:
    source: brief.md
    text: "**A11** 单测全绿:pnpm test 在 apps/nestjs-backend 0 失败,新模块单元测试覆盖所有决策点。"
  # Round 2 acceptance (A12-A19) 由独立 native change(stage-13~20)各自 spec 负责,
  # 不纳入 supervisor 当前 children.yaml 是因为 supervisor 状态快照锁在 A1-A11,
  # 等待下一轮 shape 重新确认再合并。详细文本保留在 brief.md。

# Children — 每个 child 是普通 Native change,在独立 worktree 中创建。
