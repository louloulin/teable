                  - strong [ref=f16e347]: +
                  - text: 菜单，选择
                  - strong [ref=f16e348]: 技能
                  - text: ，可以在当前对话中导入、启用、停用或试用技能。导入时需要选择谁能用这个技能：选
                  - strong [ref=f16e349]: 个人
                  - text: 只有自己能用，选
                  - strong [ref=f16e350]: 数据库
                  - text: 则当前数据库的协作者都能用，选
                  - strong [ref=f16e351]: 空间
