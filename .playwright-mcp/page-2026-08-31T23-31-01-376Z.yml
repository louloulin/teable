- generic [active] [ref=f25e1]: "# Teable - [API (540 pages)](https://help.teable.ai/_llms/en/api.md): Documentation for API. ## Docs ### AI - [Overview](https://help.teable.ai/en/basic/ai/overview.md): Explore Teable's AI capabilities for intelligent data processing, automation, and analysis. - [AI Chat](https://help.teable.ai/en/basic/ai/ai-chat.md): Interact with your data using natural language for analysis, visualization, and creation. - [AI Fields](https://help.teable.ai/en/basic/field/ai/ai-field.md): AI fields can summarize text, classify tags, generate scores, or turn content into images. - [Custom AI Model](https://help.teable.ai/en/basic/ai/custom-model.md): Add custom model providers for AI Fields, Automations, AI Chat, App Builder, and other supported AI features. - [Connect AI Agents to Teable](https://help.teable.ai/en/basic/ai/teable-skill.md): Query and update data, manage tables, and create automations or apps from your AI agent. #### App Builder - [App Builder](https://help.teable.ai/en/basic/ai/app-builder.md): Transform your data into custom web applications using AI. - [App Builder Best Practices](https://help.teable.ai/en/basic/ai/app-builder-practical-guide.md): Practical tips and patterns for getting the most out of Teable App Builder. #### Connect & Migrate Everything - [Connect & Migrate Everything](https://help.teable.ai/en/basic/ai/connect-everything.md): Use Teable AI Chat to connect and migrate Airtable, Baserow, SmartSuite, NocoDB, APIs, databases, and project data from Jira, Asana, monday.com, or ClickUp. - [Migrate Airtable](https://help.teable.ai/en/basic/ai/connect-everything/migrate-airtable.md): Migrate token-accessible Airtable data, table structure, field types, and relationships into Teable with Connect Everything. - [Migrate Baserow](https://help.teable.ai/en/basic/ai/connect-everything/migrate-baserow.md): Migrate accessible Baserow tables, fields, records, and relationships into Teable with Connect Everything. - [Migrate SmartSuite](https://help.teable.ai/en/basic/ai/connect-everything/migrate-smartsuite.md): Migrate accessible SmartSuite solutions, tables, fields, records, and relationships into Teable with Connect Everything. - [Migrate NocoDB](https://help.teable.ai/en/basic/ai/connect-everything/migrate-nocodb.md): Migrate accessible NocoDB bases, tables, fields, records, and relationships into Teable with Connect Everything. - [Migrate Jira](https://help.teable.ai/en/basic/ai/connect-everything/migrate-jira.md): Migrate API-accessible Jira projects, work items, fields, users, sprints, comments, relationships, and attachments into Teable with Connect Everything. - [Migrate monday.com](https://help.teable.ai/en/basic/ai/connect-everything/migrate-monday.md): Migrate API-accessible monday.com workspaces, boards, groups, items, subitems, columns, users, updates, and files into Teable with Connect Everything. - [Migrate ClickUp](https://help.teable.ai/en/basic/ai/connect-everything/migrate-clickup.md): Migrate API-accessible ClickUp Workspaces, Spaces, Folders, Lists, tasks, subtasks, fields, comments, and attachments into Teable with Connect Everything. - [Migrate Smartsheet](https://help.teable.ai/en/basic/ai/connect-everything/migrate-smartsheet.md): Migrate API-accessible Smartsheet workspaces, folders, sheets, reports, columns, rows, discussions, and attachments into Teable with Connect Everything. - [Connect & Migrate More Sources](https://help.teable.ai/en/basic/ai/connect-everything/more-sources.md): Use Connect Everything to connect APIs, databases, SaaS tools, and other authorized data sources to Teable. ### Space - [Overview](https://help.teable.ai/en/basic/space.md): Create, rename, delete, and manage spaces in Teable. - [Space Invitation](https://help.teable.ai/en/basic/space/space-invite.md): Invite others to become space collaborators via email or link - [Base Invitation](https://help.teable.ai/en/basic/space/base-invite.md): Manage permissions at the base level. Invite members to a specific base without granting access to the entire space for more granular and secure data collaboration. - [Collaboration Permission Details](https://help.teable.ai/en/basic/space/space-permission.md): This section outlines the operational scope for four different permission levels in spaces and bases. - [Billing & Subscription](https://help.teable.ai/en/basic/space/billing.md): Learn how to manage your subscription, view billing details, monitor usage, and download invoices. ### Automation - [Overview](https://help.teable.ai/en/basic/automation.md): Create automation workflows with AI or manual configuration. #### Triggers - [When record matches conditions](https://help.teable.ai/en/basic/automation/trigger/records/record-matches-conditions.md): Trigger a workflow when a record starts matching specific conditions - [When record created](https://help.teable.ai/en/basic/automation/trigger/records/record-created.md): Trigger a workflow when a new record is added to a table - [When record updated](https://help.teable.ai/en/basic/automation/trigger/records/record-updated.md): Trigger a workflow when an existing record is modified - [When form submitted](https://help.teable.ai/en/basic/automation/trigger/forms/form-submitted.md): Trigger a workflow when a form view is submitted - [At scheduled time](https://help.teable.ai/en/basic/automation/trigger/external/scheduled-time.md): Run a workflow on a recurring or one-time schedule - [When button clicked](https://help.teable.ai/en/basic/automation/trigger/forms/button-click.md): Trigger a workflow when a button field is clicked - [When webhook received](https://help.teable.ai/en/basic/automation/trigger/external/webhook-received.md): Trigger a workflow by receiving an HTTP request from any external system ##### When email received - [When email received overview](https://help.teable.ai/en/basic/automation/trigger/email/email-received-overview.md): Trigger a workflow when a new email arrives in a monitored mailbox - [Set up Gmail IMAP](https://help.teable.ai/en/basic/automation/trigger/email/gmail-imap.md): How to enable Gmail IMAP and create an App Password for Teable #### Actions ##### Build with AI (recommended) - [Run script](https://help.teable.ai/en/basic/automation/actions/ai/ai-script.md): Describe what you need in plain language and let AI write the automation logic for you ##### Build manually - [Create record](https://help.teable.ai/en/basic/automation/actions/records/create-record.md): Create a new record in any table as part of a workflow - [Update record](https://help.teable.ai/en/basic/automation/actions/records/update-record.md): Modify fields in an existing record as part of a workflow - [Get records](https://help.teable.ai/en/basic/automation/actions/records/get-records.md): Retrieve records from a table with optional filters and pagination - [HTTP request](https://help.teable.ai/en/basic/automation/actions/logic/http-request.md): Call any external API from a workflow - [AI generate](https://help.teable.ai/en/basic/automation/actions/ai/ai-generate.md): Use AI models to generate text or structured data in a workflow - [Cross-base access](https://help.teable.ai/en/basic/automation/actions/records/cross-base.md): Read and write data across different bases in a single workflow - [Loop (batch)](https://help.teable.ai/en/basic/automation/actions/logic/loop-run.md): Process multiple items in one action by iterating over an array - [Conditional logic](https://help.teable.ai/en/basic/automation/actions/manual/conditional-logic.md): Add if/else branching to control which actions run - [Run script](https://help.teable.ai/en/basic/automation/ai/scripting/runscript.md): Run custom JavaScript in a secure sandbox for logic that goes beyond built-in actions ###### Send email - [Send email overview](https://help.teable.ai/en/basic/automation/actions/communication/send-email-overview.md): Send customized emails from a workflow - [Set up SMTP and sender](https://help.teable.ai/en/basic/automation/actions/communication/smtp-sender.md): Configure a custom SMTP server and sender identity for automation emails #### Examples - [Auto-create records on a recurring schedule](https://help.teable.ai/en/basic/automation/examples/recurring-records.md): Use a scheduled trigger to create records automatically at regular intervals - [Run different actions based on record values](https://help.teable.ai/en/basic/automation/examples/conditional-actions.md): Use conditional logic to branch your workflow and perform different actions depending on field values - [Batch-process records with loop](https://help.teable.ai/en/basic/automation/examples/batch-loop.md): Use Get Records + Loop to process multiple records in a single workflow run - [Avoid unwanted triggers with filters and watch fields](https://help.teable.ai/en/basic/automation/examples/prevent-unwanted-triggers.md): Prevent your automations from running when they shouldn't - [Auto-record the time when a status changes](https://help.teable.ai/en/basic/automation/examples/timestamp-status.md): Automatically write a timestamp when a record's status changes to a specific value - [Push notifications to Slack, Discord, or Teams](https://help.teable.ai/en/basic/automation/examples/push-notifications.md): Send a message to a chat channel when something happens in your table - [Send deadline reminders before tasks are due](https://help.teable.ai/en/basic/automation/examples/deadline-reminders.md): Automatically email assignees about tasks that are due soon - [Generate and send a daily email digest with AI](https://help.teable.ai/en/basic/automation/examples/ai-email-digest.md): Use a scheduled trigger + AI Generate to summarize the day's activity and email it to your team - [Auto-classify new form entries with AI](https://help.teable.ai/en/basic/automation/examples/ai-classify-forms.md): Use AI Generate to automatically categorize form submissions - [Keep records in sync across multiple bases](https://help.teable.ai/en/basic/automation/examples/cross-base-sync.md): Automatically replicate new or updated records to another base using Cross-Base Access - [Build automations programmatically with the API](https://help.teable.ai/en/basic/automation/examples/api-automation.md): Create and configure workflows using the Teable API and JavaScript ### Base - [Overview](https://help.teable.ai/en/basic/base.md): Create, manage, import and export bases. Move data between Teable Cloud spaces or migrate between Cloud and Self-Hosted instances using .tea files. #### Table - [Overview](https://help.teable.ai/en/basic/table.md): Create, import, share, and manage tables in a base. - [Import](https://help.teable.ai/en/basic/table/import.md): Import CSV, Excel, Airtable, or Google Sheets data into Teable. - [Export](https://help.teable.ai/en/basic/table/export.md): Export an entire table or the data currently shown in a view as a CSV file. #### Field - [Overview](https://help.teable.ai/en/basic/field.md): Fields are the columns in a table. By combining different field types, you can build a structure that fits your workflow. - [AI Fields](https://help.teable.ai/en/basic/field/ai/ai-field.md): AI fields can summarize text, classify tags, generate scores, or turn content into images. ##### Basic Field - [Single Line Text](https://help.teable.ai/en/basic/field/single-line-text.md): Store short text such as names, titles, IDs, URLs, email addresses, and phone numbers. - [Long Text](https://help.teable.ai/en/basic/field/long-text.md): Store long text with line breaks, with support for plain text and Markdown display. - [Number](https://help.teable.ai/en/basic/field/number.md): Store numeric data such as prices, inventory, quantities, and ratios. Supports decimals, currency, percentage, and visual displays. - [Single Select](https://help.teable.ai/en/basic/field/single-select.md): Choose one option from a predefined list. Useful for statuses, categories, and priorities. - [Multiple Select](https://help.teable.ai/en/basic/field/multiple-select.md): Choose one or more values from a predefined list. Useful for tags, categories, and multi-dimensional filtering. - [Date](https://help.teable.ai/en/basic/field/date.md): Store dates and times, with support for date format, time format, time zone, and auto-fill current time. - [Rating](https://help.teable.ai/en/basic/field/rating.md): Add visual numeric ratings to records. Useful for quality, priority, satisfaction, and evaluation results. - [Checkbox](https://help.teable.ai/en/basic/field/checkbox.md): Store binary states such as yes/no or done/not done. - [Attachment](https://help.teable.ai/en/basic/field/attachment.md): Store images, PDFs, documents, and other files in records, with support for preview, download, and batch download. ##### Advanced Field - [Link](https://help.teable.ai/en/basic/field/link.md): Create relationships between tables and select records from another table in the current record. - [Rollup](https://help.teable.ai/en/basic/field/rollup.md): Aggregate values from linked records, such as sum, count, average, maximum, and minimum. - [Lookup](https://help.teable.ai/en/basic/field/lookup.md): Reference field values from a linked table through an existing link relationship and keep the data in sync. - [Conditional Rollup](https://help.teable.ai/en/basic/field/conditional-rollup.md): Calculate cross-table statistics with filter conditions and return one aggregated value. - [Conditional Lookup](https://help.teable.ai/en/basic/field/conditional-lookup.md): Look up data across tables with filter conditions and return matching record values. - [User](https://help.teable.ai/en/basic/field/user.md): Select space members in records. Useful for assignees, participants, approvers, and collaborators. - [Created By](https://help.teable.ai/en/basic/field/created-by.md): Automatically record who created each record. - [Last Modified By](https://help.teable.ai/en/basic/field/last-modified-by.md): Automatically record the user who last edited a record. - [Created Time](https://help.teable.ai/en/basic/field/created-time.md): Automatically record when each record was first created. - [Last Modified Time](https://help.teable.ai/en/basic/field/last-modified-time.md): Automatically record when a record was last edited. - [Auto Number](https://help.teable.ai/en/basic/field/auto-number.md): Generate increasing numbers when records are created. Useful for ticket numbers, order sequences, and internal IDs. ###### Formula - [Formula](https://help.teable.ai/en/basic/field/formula.md): Reference other fields and calculate text, numbers, dates, and logical conditions with formulas. - [Formula Grammar](https://help.teable.ai/en/basic/field/formula/grammar.md) - [Function Cheat Sheet](https://help.teable.ai/en/basic/field/formula/cheat-sheet.md): Quickly find formula functions, parameters, output types, and basic examples. ###### Button - [Button](https://help.teable.ai/en/basic/field/button.md): Add a clickable button to each record and use it to trigger an automation. - [Button Practical Guide](https://help.teable.ai/en/basic/field/button-practical-guide.md): Use a Button field to trigger automations and turn fixed workflows, such as lead conversion or task reminders, into one click. ##### Common - [Formatting](https://help.teable.ai/en/basic/field/common/formatter.md): Control how field values appear, such as decimal places, percentages, currency symbols, date formats, and time formats. - [Interactive Display](https://help.teable.ai/en/basic/field/common/show-as.md): Change field value display and click behavior, such as URLs, emails, phone numbers, and number charts. - [Single Value and Multiple Values](https://help.teable.ai/en/basic/field/common/is-multiple-value.md): Explains whether a field cell stores one value or a group of values. #### Records - [Overview](https://help.teable.ai/en/basic/record.md): Records are the basic data units stored in a table. In a table view, each row usually represents one record. - [Comments](https://help.teable.ai/en/basic/record/comment.md): Start discussions in records, @mention teammates, and add context to specific data. - [Record History](https://help.teable.ai/en/basic/record/record-history.md): View table-level or single-record change history and track who changed data and when. - [Archive and Trash](https://help.teable.ai/en/basic/record/archive-trash.md): Archive records to move them out of a table without losing them, and restore deleted records from the table trash. #### View - [Grid](https://help.teable.ai/en/basic/view/grid.md): Display records in rows and columns for structured viewing, editing, and data cleanup. - [Form](https://help.teable.ai/en/basic/view/form.md): Use a Form view to collect submissions and save each response as a new record in the current table. - [Kanban](https://help.teable.ai/en/basic/view/kanban.md): Display records as cards grouped by a field, useful for tracking status, stages, and workflows. - [Gallery](https://help.teable.ai/en/basic/view/gallery.md): Display records as image cards for product catalogs, asset libraries, and portfolios. - [Calendar](https://help.teable.ai/en/basic/view/calendar.md): View and manage records by date, such as meetings, events, schedules, and project timelines. - [View Toolbar](https://help.teable.ai/en/basic/view/toolbar.md): Use filters, groups, sorting, sharing, and view collaboration settings in the current view. ### Authority Matrix #### Authority Matrix - [Overview](https://help.teable.ai/en/basic/authority-matrix.md): Set access scopes for different teams in the same base, so members only see, edit, or export the data they need. - [Authority Matrix Guidelines](https://help.teable.ai/en/basic/authority-matrix/authority-matrix-practical-guide.md): Configure Authority Matrix roles for a sales team that needs shared data, ownership-based record access, and restricted data entry. ### SSO - [Single Sign-On (SSO)](https://help.teable.ai/en/basic/sso/overview.md): Configure SSO for a Teable space. - [Azure Entra ID SSO](https://help.teable.ai/en/basic/sso/azure-entra-id.md): Configure Azure Entra ID as your SSO authentication provider for Teable - [Okta SSO](https://help.teable.ai/en/basic/sso/okta.md): Configure Okta as your SSO authentication provider for Teable - [Google Workspace SSO](https://help.teable.ai/en/basic/sso/google-workspace.md): Configure Google Workspace as your SSO authentication provider for Teable - [Auth0 SSO](https://help.teable.ai/en/basic/sso/auth0.md): Configure Auth0 as your SSO authentication provider for Teable - [OneLogin SSO](https://help.teable.ai/en/basic/sso/onelogin.md): Configure OneLogin as your SSO authentication provider for Teable - [Authentik SSO](https://help.teable.ai/en/basic/sso/authentik.md): Configure Authentik as your SSO authentication provider for Teable ### Comparison - [Teable vs Excel](https://help.teable.ai/en/compare/teable-vs-excel.md): Compare Teable's modern database capabilities with Excel's spreadsheet functionality. Discover which solution better handles data security, collaboration at scale, and complex analytics for your business needs. ## Self-hosted ### Self-Hosted License - [Subscribe and Activate License](https://help.teable.ai/en/deploy/activate.md): Learn how to buy, subscribe, and activate a Teable self-hosted license. Get your license key and unlock premium features for your self-hosted deployment. ### Quick Start - [Deployment](https://help.teable.ai/en/deploy/choose.md): Pick between Teable Cloud, standalone self-hosting, and the full-featured self-hosted platform. - [Architecture](https://help.teable.ai/en/deploy/architecture.md): Deploying Teable gives you four platforms in one: a secure agent sandbox, a resource-efficient app deployment platform, an AI workflow engine, and a full-featured collaboration platform on PostgreSQL. ### Admin Panel - [Overview](https://help.teable.ai/en/basic/admin-panel/overview.md): Teable's self-hosted Admin Panel is used to manage instance users, spaces, and system configuration. - [Users](https://help.teable.ai/en/basic/admin-panel/users.md): Manage all users in your instance through the admin panel, including viewing user information, deactivating and deleting users. - [Spaces](https://help.teable.ai/en/basic/admin-panel/spaces.md): Manage all spaces in your instance through the admin panel, including viewing space information, deleting spaces, and configuring auto-join settings. - [Database Tenant](https://help.teable.ai/en/basic/admin-panel/database-tenant.md): Host Teable Space data in a customer-managed PostgreSQL database. - [Template Admin](https://help.teable.ai/en/basic/admin-panel/template-admin.md): Manage workflow templates for your organization, enabling users to quickly start with pre-configured bases. - [Instance Settings](https://help.teable.ai/en/basic/admin-panel/settings.md): Manage instance-level switches, email settings, and system pending items. - [AI Settings](https://help.teable.ai/en/basic/admin-panel/ai-setting.md): Configure AI Chat, AI fields, AI automation, and App Builder for a self-hosted instance. - [Skills](https://help.teable.ai/en/basic/admin-panel/skills.md): Publish skills that every AI agent in the instance can use. - [Automation management](https://help.teable.ai/en/basic/admin-panel/automation-management.md): View automation run status, success rate, and run history in the Admin Panel. - [Table Query Ops](https://help.teable.ai/en/basic/admin-panel/table-query-ops.md): Review query risk recommendations for slow tables and confirm database improvements. - [Computed Outbox](https://help.teable.ai/en/basic/admin-panel/computed-outbox.md): Monitor BullMQ delivery and computed task backlog in the Admin Panel. - [AI Generation Queue](https://help.teable.ai/en/basic/admin-panel/ai-generation-queue.md): Review AI field generation status in the current self-hosted instance. - [Audit log](https://help.teable.ai/en/basic/admin-panel/audit-log.md): Review instance-wide activity, filter operation history, and inspect audit log details in the Admin Panel. - [Announcements](https://help.teable.ai/en/basic/admin-panel/announcements.md): Publish in-app announcements to everyone, to selected spaces, or to selected users, and withdraw them when they no longer apply. - [Sandbox Agent](https://help.teable.ai/en/basic/admin-panel/sandbox-agent.md): Configure and manage Sandbox Agent. ### Configuration - [Environment Variables](https://help.teable.ai/en/deploy/env.md): Here are all available environment variables in Teable and their explanations - [Configure Email Service](https://help.teable.ai/en/deploy/email.md): Enable email service to activate in-app email notifications, self-service password reset, invitation emails, and other features. - [OIDC Single Sign-On](https://help.teable.ai/en/deploy/oidc.md): Configure OpenID Connect (OIDC) authentication for your self-hosted Teable instance. ### Compliance & Telemetry - [Telemetry](https://help.teable.ai/en/deploy/telemetry.md): Learn how Teable self-hosted telemetry works, what is reported, and how to disable it. ### Maintenance - [Version Upgrade](https://help.teable.ai/en/deploy/upgrade.md) ### Deprecated - [One-Click Cloud Deployment (Deprecated)](https://help.teable.ai/en/deploy/one-key.md): Deploy Teable quickly using cloud provider templates, then subscribe to unlock paid features and activate your license. ## Security - [Security](https://help.teable.ai/en/basic/security.md): Learn about Teable's security architecture, data protection, and compliance measures ## Changelog - [Changelog 2026](https://help.teable.ai/en/changelog.md) - [Changelog 2025](https://help.teable.ai/en/changelog-2025.md) - [Changelog 2024](https://help.teable.ai/en/changelog-2024.md) ## Other - [About Teable](https://help.teable.ai/archive/en/about.md): Teable uses a simple, spreadsheet-like interface to create powerful database applications. Collaborate with your team in real-time, and scale to millions of rows - [Actions](https://help.teable.ai/archive/en/basic/automation/action.md) - [Send email](https://help.teable.ai/archive/en/basic/automation/actions/communication/send-email.md): Send customized emails from a workflow - [AI Action](https://help.teable.ai/archive/en/basic/automation/ai-action.md): In automation, an action is one of the operations to be executed after a trigger is activated. Teable's AI Action enables dynamic parsing and content generation of table data through the intelligent combination of natural language instructions (Prompt) and structured data (field values). - [AI Script](https://help.teable.ai/archive/en/basic/automation/ai-script.md): Use JavaScript code to automate data processing and implement complex business logic and data operations - [Sample scripts](https://help.teable.ai/archive/en/basic/automation/ai/scripting/sample-scripts.md): Ready-to-use JavaScript examples for common automation tasks - [Example: Create Automation with JavaScript](https://help.teable.ai/archive/en/basic/automation/example.md): Create automation by calling Teable APIs - [Conditional logic](https://help.teable.ai/archive/en/basic/automation/logic.md): Add if/else branching to control which actions run - [Triggers](https://help.teable.ai/archive/en/basic/automation/trigger.md) - [A Practical Guide to AI Fields](https://help.teable.ai/archive/en/basic/field/ai/ai-field-practical-guide.md) - [关于 Teable](https://help.teable.ai/archive/zh/about.md): Teable 是一款企业级高性能多维表格解决方案，通过无代码方式快速构建业务管理系统，支持私有部署和精细权限管理。 - [动作](https://help.teable.ai/archive/zh/basic/automation/action.md) - [发送邮件](https://help.teable.ai/archive/zh/basic/automation/actions/communication/send-email.md): 在工作流中发送自定义邮件 - [AI 动作](https://help.teable.ai/archive/zh/basic/automation/ai-action.md) - [AI 脚本](https://help.teable.ai/archive/zh/basic/automation/ai-script.md): 使用 JavaScript 代码自动化处理数据，实现复杂的业务逻辑和数据操作 - [示例脚本](https://help.teable.ai/archive/zh/basic/automation/ai/scripting/sample-scripts.md): 常用自动化脚本示例，可直接复制使用或按需修改 - [示例：用 JavaScript 创建自动化](https://help.teable.ai/archive/zh/basic/automation/example.md): 通过调用 Teable 接口创建自动化 - [条件逻辑](https://help.teable.ai/archive/zh/basic/automation/logic.md) - [触发器](https://help.teable.ai/archive/zh/basic/automation/trigger.md) - [AI 字段实践指南](https://help.teable.ai/archive/zh/basic/field/ai/ai-field-practical-guide.md) - [AI Settings](https://help.teable.ai/en/basic/space/ai-setting.md): This page has moved. - [Enable Standalone Dashboard](https://help.teable.ai/en/deploy/dashboard.md): How to enable the Standalone Dashboard feature for self-hosted deployments - [Docker Deployment](https://help.teable.ai/en/deploy/docker.md) - [Nginx (Reverse Proxy)](https://help.teable.ai/en/deploy/nginx.md): Recommended Nginx reverse proxy setup for Teable: HTTPS (certificates), WebSocket, Docker tips, and Nginx Proxy Manager. - [AI 配置](https://help.teable.ai/zh/basic/space/ai-setting.md): 此页面内容已迁移。 - [开启 Standalone Dashboard](https://help.teable.ai/zh/deploy/dashboard.md): 自部署用户如何开启 Standalone Dashboard 功能 - [Docker 部署](https://help.teable.ai/zh/deploy/docker.md): 使用 Docker Compose 部署 Teable，并配置常用部署选项。 - [Nginx 配置](https://help.teable.ai/zh/deploy/nginx.md): Teable 的 Nginx 反向代理配置：HTTPS（证书）、WebSocket、Docker 场景与 Nginx Proxy Manager。 ## OpenAPI Specs - [swagger](/swagger.json) - [extensions](/.vscode/extensions.json) - [settings](/.vscode/settings.json) > The links below point to documentation indexes. Follow each `/_llms/` index recursively until you reach documentation pages. ## Indexes - [English / API (540 pages)](https://help.teable.ai/_llms/en/api.md): Documentation for English / API. - [Chinese (678 pages)](https://help.teable.ai/_llms/zh.md): Documentation for Chinese. - [Chinese / API 文档 (540 pages)](https://help.teable.ai/_llms/zh/api.md): Documentation for Chinese / API 文档."