                  - text: ：使用顶部的切换器在
                  - strong [ref=f3e381]: 桌面
                  - text: 、
                  - strong [ref=f3e382]: 平板
                  - text: 和
                  - strong [ref=f3e383]: 移动
                  - text: 视图之间切换。
                - listitem [ref=f3e384]:
                  - strong [ref=f3e385]: 生成中预览
                  - text: ：应用构建器生成应用时，你可以在预览面板看到界面逐步成形。
                - listitem [ref=f3e386]:
                  - strong [ref=f3e387]: 即时反馈
                  - text: ：应用构建器完成修改后，预览会刷新为最新保存的版本。
              - generic [ref=f3e388]: 可以使用预览底部的浮动工具栏进行定点修改：
              - list [ref=f3e389]:
                - listitem [ref=f3e390]:
                  - text: 选择
                  - strong [ref=f3e391]: 选择要修改的元素
                  - text: ，再点击预览中的元素。应用构建器会把该元素添加到对话输入框中。补充修改要求并发送后，AI 会针对这个元素修改应用。
                - listitem [ref=f3e392]:
                  - text: 选择
                  - strong [ref=f3e393]: 直接编辑文本
                  - text: ，再点击预览中的静态文本并输入新内容。可以连续修改多处文本，再点击
                  - strong [ref=f3e394]: 保存
                  - text: ；点击
                  - strong [ref=f3e395]: 放弃修改
                  - text: 可以撤销尚未保存的文本修改。
              - generic [ref=f3e396]:
                - text: 从数据读取或由应用计算的动态文本不能直接编辑。请选中对应元素，再通过对话描述修改要求。AI 生成期间，元素选择和文本编辑会暂停。按
