                  - /url: "#1-对话界面-ai-驱动"
                - generic [ref=f3e344] [cursor=pointer]: 1. 对话界面 (AI 驱动)
              - generic [ref=f3e345]: 这是您的应用控制中心。
              - list [ref=f3e346]:
                - listitem [ref=f3e347]:
                  - strong [ref=f3e348]: 自然语言编辑
                  - text: ：描述您想做的更改，如
                  - emphasis [ref=f3e349]: “把标题改成蓝色”
                  - text: 或
                  - emphasis [ref=f3e350]: “添加一个新记录提交表单”
                  - text: 。
                - listitem [ref=f3e351]:
                  - strong [ref=f3e352]: 智能路由
                  - text: ：AI 能够理解您指的是哪个组件或页面，并直接对其进行修改。
                - listitem [ref=f3e353]:
                  - strong [ref=f3e354]: 集成连接
                  - text: ：当应用任务需要访问第三方账号时，应用构建器会在对话面板中显示类似
                  - strong [ref=f3e355]: 连接 Slack
                  - text: 的卡片。点击
                  - strong [ref=f3e356]: 连接
                  - text: 可通过 OAuth 授权；点击
                  - strong [ref=f3e357]: 跳过
                  - text: 会取消本次授权，AI 会在不使用该连接的情况下继续处理可完成的部分。
                - listitem [ref=f3e358]:
                  - strong [ref=f3e359]: 技能
                  - text: ：打开
                  - strong [ref=f3e360]: +
                  - text: 菜单，选择
                  - strong [ref=f3e361]: 技能
                  - text: ，可以管理当前应用对话可用的技能。这里添加的 App 技能只在当前应用中可用；应用所属数据库和空间中共用的技能，在这里也能直接使用。在输入框中输入
                  - code [ref=f3e362]: /
                  - text: ，可以选择已启用的技能。
                - listitem [ref=f3e363]:
                  - strong [ref=f3e364]: 文件管理
                  - text: ：打开
                  - strong [ref=f3e365]: +
                  - text: →
                  - strong [ref=f3e366]: 更多
                  - text: →
                  - strong [ref=f3e367]: 文件管理
                  - text: ，可以查看当前应用沙箱中的文件，用于预览支持的文件类型、下载生成文件，或删除不再需要的文件和文件夹。
                - listitem [ref=f3e368]:
                  - strong [ref=f3e369]: 清除对话历史
                  - text: ：如果当前对话已经跑偏，可点击面板右下角的
                  - strong [ref=f3e370]: 清除对话
                  - text: ，重新开始一个新的会话。这样会丢失当前对话的历史上下文，但不会删除应用本身。首次使用会弹出确认，并可选择下次不再提示。
