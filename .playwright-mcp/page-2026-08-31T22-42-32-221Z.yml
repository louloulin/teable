            - generic [ref=f3e285]:
              - heading "应用构建器" [level=1] [ref=f3e288]
              - paragraph [ref=f3e290]: 利用 AI 将您的数据转化为定制化的网络应用。
            - generic [ref=f3e291]:
              - note "注意" [ref=f3e292]:
                - generic [ref=f3e296]: 云端版本所有方案可用；私有部署版本需要商业版及以上方案。
              - generic [ref=f3e297]: Teable 应用构建器 (App Builder) 允许您在不编写代码的情况下，将数据库转化为功能齐全、定制化的 Web 应用程序。结合数据结构的力量和 AI 驱动的设计，您可以在几分钟内发布内部工具、客户门户和数据仪表板。
              - heading "导航到标题 概览" [level=2] [ref=f3e298]:
                - link "导航到标题" [ref=f3e299] [cursor=pointer]:
                  - /url: "#概览"
                - generic [ref=f3e304] [cursor=pointer]: 概览
              - generic [ref=f3e305]: 应用构建器（App Builder）遵循 “Prompt to App”（提示词即应用）的工作流。您描述想要的内容，AI 为您构建应用结构、页面和逻辑。然后，您可以使用可视化编辑器或代码微调每一个细节。
              - note "注意" [ref=f3e306]:
                - generic [ref=f3e311]:
                  - text: 应用构建器用于创建自定义界面和独立应用。如果需要在数据库内部进行交互式数据分析和临时提问，请使用
                  - link "AI 对话" [ref=f3e312] [cursor=pointer]:
                    - /url: /zh/basic/ai/ai-chat
                  - text: 。
              - heading "导航到标题 创建应用" [level=2] [ref=f3e313]:
                - link "导航到标题" [ref=f3e314] [cursor=pointer]:
                  - /url: "#创建应用"
                - generic [ref=f3e319] [cursor=pointer]: 创建应用
              - generic [ref=f3e320]: 主要有两种创建应用的方式：
              - list [ref=f3e321]:
                - listitem [ref=f3e322]:
                  - strong [ref=f3e323]: 从数据库创建
                  - text: ：在数据库中，点击 ”+ 创建” 选择 “新应用” 生成一个链接到当前数据的应用。
                - listitem [ref=f3e324]:
                  - strong [ref=f3e325]: 从对话创建
                  - text: ：打开 AI Chat 并说 “为这个客户表创建一个 CRM 应用”。
              - heading "导航到标题 应用编辑器界面" [level=2] [ref=f3e326]:
                - link "导航到标题" [ref=f3e327] [cursor=pointer]:
                  - /url: "#应用编辑器界面"
                - generic [ref=f3e332] [cursor=pointer]: 应用编辑器界面
              - generic [ref=f3e333]: 应用构建器为非技术用户和开发者提供了双重界面。
