              - paragraph [ref=f22e290]: 在同一个数据库中为不同团队设置访问范围，让成员只看到、修改或导出自己需要的数据。
            - generic [ref=f22e291]:
              - note "提示" [ref=f22e292]:
                - generic [ref=f22e296]: 商业版及以上适用
              - generic [ref=f22e297]: 当销售、财务、运营和管理层共用同一个数据库时，权限不只是决定谁能进入数据库，还关系到谁能看哪些数据、改哪些内容，以及是否可以导入或导出。权限矩阵适合把数据集中管理，同时按职责隔离访问范围的团队。
              - generic [ref=f22e298]: 你可以为成员或部门分配自定义角色，让不同角色只访问需要的表格、应用和工作流。对表格，还可以继续限制可见视图、可见记录、可编辑字段，以及导入/导出权限。比如销售只维护自己的客户，财务只查看账单字段，管理层查看完整数据。
